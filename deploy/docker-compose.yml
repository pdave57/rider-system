
services:

  postgres:
    image: postgres:16-alpine
    container_name: rydex-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rydex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rydex-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rydex
      RABBITMQ_DEFAULT_PASS: rydex_pass
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: rydex-nginx
    ports:
      - "80:80"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - rabbitmq

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/dockerfile
    container_name: rydex-gateway
    env_file: ./env/.env
    environment:
      - GATEWAY_PORT=8001
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - DISPATCH_SERVICE_URL=http://dispatch-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - REALTIME_SERVICE_URL=http://realtime-service:8085
      - RIDER_SERVICE_URL=http://rider-service:8086
      - UPLOAD_SERVICE_URL=http://upload-service:8087
    ports:
      - "8001:8001"
    depends_on:
      - auth-service
      - order-service
      - dispatch-service
      - payment-service
      - realtime-service
      - rider-service

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/dockerfile
    container_name: rydex-auth
    env_file: ./env/.env
    environment:
      - AUTH_SERVICE_PORT=8081
      - DB_NAME=rydex_auth
      - RABBITMQ_URL=amqp://rydex:rydex_pass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/dockerfile
    container_name: rydex-order
    env_file: ./env/.env
    environment:
      - ORDER_SERVICE_PORT=8082
      - DB_NAME=rydex_orders
      - RABBITMQ_URL=amqp://rydex:rydex_pass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  dispatch-service:
    build:
      context: ..
      dockerfile: services/dispatch-service/dockerfile
    container_name: rydex-dispatch
    env_file: ./env/.env
    environment:
      - DISPATCH_SERVICE_PORT=8083
      - DB_NAME=rydex_dispatch
      - RABBITMQ_URL=amqp://rydex:rydex_pass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/dockerfile
    container_name: rydex-payment
    env_file: ./env/.env
    environment:
      - PAYMENT_SERVICE_PORT=8084
      - DB_NAME=rydex_payments
      - RABBITMQ_URL=amqp://rydex:rydex_pass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  realtime-service:
    build:
      context: ..
      dockerfile: services/realtime-service/dockerfile
    container_name: rydex-realtime
    env_file: ./env/.env
    environment:
      - REALTIME_SERVICE_PORT=8085
      - RABBITMQ_URL=amqp://rydex:rydex_pass@rabbitmq:5672/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rider-service:
    build:
      context: ..
      dockerfile: services/rider-service/dockerfile
    container_name: rydex-rider
    env_file: ./env/.env
    environment:
      - RIDER_SERVICE_PORT=8086
      - DB_NAME=rydex_riders
      - RABBITMQ_URL=amqp://rydex:rydex_pass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
