
services:

  postgres:
    image: postgres:16-alpine
    container_name: runns-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin@123#
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: runns-pgadmin
    env_file: ./env/.env
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin@123#
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: runns-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: runns-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: runns
      RABBITMQ_DEFAULT_PASS: runnspass    
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: runns-nginx
    ports:
      - "80:80"
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro    
    depends_on:
      - api-gateway
      - rabbitmq

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/dockerfile
    container_name: runns-gateway
    env_file: ./env/.env
    environment:
      - GATEWAY_PORT=8001
      - AUTH_SERVICE_URL=http://auth-service:8081
      - ORDER_SERVICE_URL=http://order-service:8082
      - DISPATCH_SERVICE_URL=http://dispatch-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - REALTIME_SERVICE_URL=http://realtime-service:8085
      - RIDER_SERVICE_URL=http://rider-service:8086
      - UPLOAD_SERVICE_URL=http://upload-service:8087
    ports:
      - "8001:8001"
    depends_on:
      - auth-service
      - order-service
      - dispatch-service
      - payment-service
      - realtime-service
      - rider-service
    
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/dockerfile
    container_name: runns-auth
    env_file: ./env/.env
    environment:
      - AUTH_SERVICE_PORT=8081
      - DB_NAME=runns_auth
      - RABBITMQ_URL=amqp://runns:runnspass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    
  order-service:
    build:
      context: ..
      dockerfile: services/order-service/dockerfile
    container_name: runns-order
    env_file: ./env/.env
    environment:
      - ORDER_SERVICE_PORT=8082
      - DB_NAME=runns_orders
      - RABBITMQ_URL=amqp://runns:runnspass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    
  dispatch-service:
    build:
      context: ..
      dockerfile: services/dispatch-service/dockerfile
    container_name: runns-dispatch
    env_file: ./env/.env
    environment:
      - DISPATCH_SERVICE_PORT=8083
      - DB_NAME=runns_dispatch
      - RABBITMQ_URL=amqp://runns:runnspass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  
  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/dockerfile
    container_name: runns-payment
    env_file: ./env/.env
    environment:
      - PAYMENT_SERVICE_PORT=8084
      - DB_NAME=runns_payments
      - RABBITMQ_URL=amqp://runns:runnspass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  realtime-service:
    build:
      context: ..
      dockerfile: services/realtime-service/dockerfile
    container_name: runns-realtime
    env_file: ./env/.env
    environment:
      - REALTIME_SERVICE_PORT=8085
      - RABBITMQ_URL=amqp://runns:runnspass@rabbitmq:5672/
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  rider-service:
    build:
      context: ..
      dockerfile: services/rider-service/dockerfile
    container_name: runns-rider
    env_file: ./env/.env
    environment:
      - RIDER_SERVICE_PORT=8086
      - DB_NAME=runns_riders
      - RABBITMQ_URL=amqp://runns:runnspass@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  upload-service:
    build:
      context: ..
      dockerfile: services/upload-service/dockerfile
    container_name: runns-upload
    env_file: ./env/.env
    environment:
      - UPLOAD_SERVICE_PORT=8087
      - DB_NAME=runns_auth
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
